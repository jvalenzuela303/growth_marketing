              - tabpanel "Description" [ref=e226]:
                - paragraph [ref=e227]: Amplificador integrado CAYIN MT-35 MK2 BT. Seguimos con los tubos de potencia EL34, pero ahora tenemos la posibilidad de seleccionar entre modo de operación TRIODO o ULTRALINEAL, el equipo da una potencia de 18 vatios RMS en TRIODO y 35 vatios RMS en ULTRALINEAL. Incluye dial que permite calibrar la polarización de los tubos sin necesidad de un multímetro. Además de las tradicionales 3 entradas RCA, un receptor Bluetooth LDAC que permite la recepción de audio digital desde cualquier dispositivo.
                - paragraph [ref=e228]:
                  - text: "Características:"
                  - text: – Hecho a mano con el mejor cableado punto a punto.
                  - text: – Transformadores de salida EI con gran ancho de banda.
                  - text: – Fuente de alimentación con un gran transformador toroidal.
                  - text: – Etapa de driver de entrada con 3 válvulas 5BK7A NOS.
                  - text: – Se utilizan 4 válvulas de salida EL34 para la amplificación en modo AB.
                  - text: – Fácil ajuste de la polarización por parte del usuario mediante un medidor frontal.
                  - text: – Entrada Bluetooth (UAT, LDAC, AAC, SBC).
                  - text: – Conexión de auriculares en el panel frontal.
                  - text: – Modo Triodo / Ultralineal.
                  - text: – Potenciómetro Alps de alta calidad para un control preciso del volumen.
                  - text: – Rejilla de protección de las válvulas incluida.
                - heading "Especificaciones" [level=3] [ref=e229]
                - list [ref=e230]:
                  - listitem [ref=e231]: Respuesta en frecuencia 8Hz～55KHz (-3dB)
                  - listitem [ref=e232]: Potencia de salida (RMS) a 4 y 8 ohmios 35W+35W Ultralineal, 18W+18W Triodo.
                  - listitem [ref=e233]: Distorsión armónica total (THD) 1% (1kHz)
                  - listitem [ref=e234]: Separación de la tensión externa 89 dB
                  - listitem [ref=e235]: Impedancia de entrada 100kOhm
                  - listitem [ref=e236]: Sensibilidad de entrada 300mV
                  - listitem [ref=e237]: Circuito Clase A/B
                  - listitem [ref=e238]: Configuración de válvulas 3x válvulas 5BK7A NOS, 4x EL34
                  - listitem [ref=e239]: Características Medidor de polarización integrado
                  - listitem [ref=e240]: Entradas 3 x línea, Bluetooth (versión V5.0)
                  - listitem [ref=e241]: Procesador CSR8670
                  - listitem [ref=e242]: Alcance 10 metros
                  - listitem [ref=e243]: Estándares Bluetooth UAT, LDAC, AAC, SBC
                  - listitem [ref=e244]: Chipset DAC ES9018K2M SABRE32
                  - listitem [ref=e245]: Circuito Clase A/B
                  - listitem [ref=e246]: Tomas de impedancia de los altavoces 4 Ohm, 8 Ohm
                  - listitem [ref=e247]: Consumo máximo de energía 270VA
