              - tabpanel "Descripción" [ref=e254]:
                - paragraph [ref=e255]:
                  - text: El amplificador de válvulas Cayin Jazz 80 KT88/EL34 cuenta con cuatro válvulas acopladas con dos válvulas 12AU7 y dos 12AX7 para dar a su música calidez, timbre natural y precisión. Cayin Jazz 80 utiliza componentes cuidadosamente seleccionados y ensamblados a mano en una configuración diseñada para minimizar el recorrido de la señal. La amplificación es proporcionada por ocho válvulas de muy alta calidad, incluyendo cuatro KT88/EL34 para la sección de potencia. Éstas se combinan con una etapa de preamplificación que utiliza dos 12AX7 para aumentar el nivel de tensión de las señales musicales entrantes. Éstas se acoplan a dos válvulas 12AU7 que actúan como divisores de fase para accionar las válvulas KT88. Puede funcionar en modo triodo o ultralineal. En modo triodo, ofrece un sonido cálido y texturizado con una imagen completa. La potencia de salida es de 2 x 20 vatios a 8 ohmios. En modo ultralineal, la respuesta de graves se amplía y la potencia aumenta a 2 x 40 vatios, con una musicalidad que sigue siendo excepcional. Como resultado, puede alimentar eficazmente la mayoría de los parlantes tanto bookshelf o columnas.
                  - text: Con una potencia de salida de 2x 40W en modo ultralineal, proporciona una potencia óptima para la mayoría de los parlantes del mercado.
                - heading "Especificaciones" [level=3] [ref=e256]
