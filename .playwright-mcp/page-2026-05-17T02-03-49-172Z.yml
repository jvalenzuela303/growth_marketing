              - heading "Descripción" [level=2] [ref=e63]
              - paragraph [ref=e64]: Registrador analizador de redes monofásico.
              - paragraph [ref=e65]: Mide y Reporta
              - paragraph [ref=e66]: Tensión de línea, Desviación de Tensión, Distorsión Armónica de tensión (THD%) hasta la componente 50°, armonicos de tensión hasta la componente 50º, Flicker (PST, PLT y ΔV/V%) e Interrupciones.
              - paragraph [ref=e67]: Capacidad de memoria para registrar más de 80 días continuos en intervalos de 10 minutos.
              - paragraph [ref=e68]: Uso directo en intemperie
              - paragraph [ref=e69]: Grado de protección IP65. Totalmente aislado, facilita la instalación segura en espacios estrechos y expuestos a tensión.
              - paragraph [ref=e70]: Personalización de los Reportes
              - paragraph [ref=e71]: Software de lectura y aplicación amigable y de alto grado de personalización. Admite la configurar los formatos de registros, reportes y gráficas, según los requerimientos de uso o normativas de control local. Genera automáticamente Reportes de Calidad. Puerto de comunicación óptico USB. El tiempo típico de lectura es 1 minuto.
              - paragraph [ref=e72]: Compatibilidad de Procesamiento
              - paragraph [ref=e73]: El software incluye la opción de Conversión para generar un archivo tipo texto según un formato solicitado. Esta opción permite migrar al ECA-PQ1 y mantener la compatibilidad con el software de gestión en uso por la distribuidora eléctrica.
