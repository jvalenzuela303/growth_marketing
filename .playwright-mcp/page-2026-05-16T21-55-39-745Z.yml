              - tabpanel "Description" [ref=e244]:
                - paragraph [ref=e245]:
                  - text: Veinticuatro vatios por canal, diseño de un solo extremo, estéreo integrado Class A Puro.
                  - text: Amplificador con válvulas 845 de potencia de salida. Todos los tubos integrados con etapa de amplificación de voltaje 6SN7, etapa de controlador 300B y 845.
                  - text: Tubos de salida Tres pares de entradas de línea, un par de Pre-In están ubicados en el panel trasero del
                  - text: amplificador. A diferencia de otras entradas, Pre-In le ofrece la posibilidad de conectarse a otros
                  - text: Preamplificadores para que puedas usar el CS-845A Reference como un amplificador de potencia. Los terminales de altavoz para altavoces de 4 y 8 ohmios se encuentran en el panel trasero del
                  - text: Amplificador.
                  - text: Aprovechando el transformador de salida personalizado CS-845A Reference proporciona
                  - text: Salida de auriculares que puede manejar la mayoría de los auriculares del mercado. Los controles de polarización del usuario para 845 se han utilizado para el ajuste de polarización y se ha agregado un medidor a la placa superior para permitirle monitorear el sesgo con facilidad. Se puede acceder al Hum Balancer para tubo 300B en la placa superior para facilitar el ajuste del
                  - text: nivel de zumbido de los tubos.
                  - text: La selección de retroalimentación negativa está disponible en el frente y en el control remoto que puede
                  - text: elegir entre dos niveles de NFB para disfrutar de las diferentes salidas de sonido del
                  - text: CS-845A Reference.
                  - text: Bajo el estado de 0dB tiene un sonido abierto con más detalles mientras que -3dB CS-845A Reference emite un sonido suave y limpio.
                  - text: Frontal de aluminio anodizado, chasis totalmente ventilado con excelente acabado, construcción hecha a mano con el más fino cableado punto a punto. Circuito de arranque suave y retardo de alto voltaje para proteger el amplificador para una vida útil prolongada demcomponentes sensibles.
                  - text: Los fusibles de alto voltaje se utilizan en el amplificador para protección. En caso de que hubiera falla
                  - text: de tubos, el Fusible reaccionará primero para que pueda saber fácilmente dónde está el problema.
                  - strong [ref=e246]: "Piezas premium:"
                  - text: control de volumen Alps, enchufes de tubo de porcelana, condensadores de grado de audio y resistencias de película de carbono, transformador toroidal para fuente de alimentación, EI de ancho de banda amplio, transformador de salida, etc.
                  - text: Control remoto, la referencia CS-845A puede memorizar la última operación del
                  - text: unidad una vez apagada.
                  - text: "Acabado frontal disponible: Plata y Negro"
