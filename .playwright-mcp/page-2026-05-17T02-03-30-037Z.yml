            - paragraph [ref=e41]:
              - text: El
              - strong [ref=e42]: Medidor de Corriente y Razón de Transformación en Media Tensión ETCR
              - text: es un instrumento de medición avanzado diseñado para evaluar la corriente eléctrica y la razón de transformación en sistemas de media tensión. Este dispositivo es ideal para profesionales de la electricidad y la energía que necesitan realizar pruebas de transformación de corriente, y se utiliza principalmente en redes eléctricas industriales y de distribución. El medidor proporciona mediciones precisas y fiables para garantizar el funcionamiento eficiente de los transformadores de corriente y otros equipos eléctricos en sistemas de media tensión.
