name: Deploy AI Engine to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-engine/**'
      - '.github/workflows/deploy-ai-engine.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: ge-ai-engine
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ge-ai-engine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          cd apps/ai-engine
          pip install -r requirements.txt
          pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest apps/ai-engine/
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --min-instances 1 \
            --max-instances 5 \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 20 \
            --port 8000 \
            --no-traffic \
            --set-secrets "ANTHROPIC_API_KEY=ge-anthropic-key:latest,OPENAI_API_KEY=ge-openai-key:latest"

      - name: Route Traffic
        run: |
          gcloud run services update-traffic $SERVICE_NAME \
            --to-latest \
            --region $GCP_REGION
